name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        dc: [dmd-latest, ldc-latest]
        exclude:
          # dmd has no arm64 build; macos-latest is arm64
          - os: macos-latest
            dc: dmd-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dc }}

      - name: Verify Build
        run: dub build --build=unittest

      - name: Smoke test (first koan must fail at basics.d:16)
        run: dub run 2>&1 | perl -pe 's/\e\[[0-9;]*m//g' | grep 'koans/basics.d at line 16'
